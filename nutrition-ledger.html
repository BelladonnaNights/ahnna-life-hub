    --espresso-2:#241c15; --espresso-3:#2c2219; --brass:#b6893f; --brass-bright:#d4a656;

  html,body{margin:0;padding:0;}
  body{
    background:var(--espresso);
    background-image:radial-gradient(circle at 15% 0%, rgba(182,137,63,0.06), transparent 45%),

  header{ padding:24px 20px 16px 20px; border-bottom:1px solid var(--line); }

  nav button.active{ background:var(--brass); color:var(--espresso); border-color:var(--brass); font-weight:600; }
  main{ padding:18px 16px; max-width:640px; margin:0 auto; }
  section{ display:none; } section.active{ display:block; }
  .card{ background:var(--espresso-2); border:1px solid var(--line); border-radius:4px; padding:16px; margin-bottom:14px; }

  .card .sub{ font-size:12.5px; color:var(--parchment-dim); margin:0 0 12px 0; line-height:1.5; }

  .row-flex button{ background:var(--brass); color:var(--espresso); border:none; padding:8px 14px; border-radius:3px;
    font-weight:600; font-size:12.5px; cursor:pointer; white-space:nowrap; }
  .field label{ display:block; font-size:10px; color:var(--parchment-dim); margin-bottom:3px; }
  .field input, .field select{ width:100%; background:var(--espresso); border:1px solid var(--line); color:var(--parchment); font-size:14px;

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:8px; }
  .notes-field textarea, .paste-box textarea{ width:100%; background:var(--espresso); border:1px solid var(--line); color:var(--parchment); font-size:12.5px;

function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function toISO(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function todayISO(){ return toISO(new Date()); }
function addDays(iso, n){
  const parts = iso.split('-').map(Number);
  const dt = new Date(parts[0], parts[1]-1, parts[2]);
  dt.setDate(dt.getDate() + n);
  return toISO(dt);
}
function formatDateDisplay(iso){
  if(/^\d{4}-\d{2}-\d{2}$/.test(iso)){
    const p = iso.split('-').map(Number);
    return new Date(p[0], p[1]-1, p[2]).toLocaleDateString('en-US', { month:'short', day:'numeric' });
  }
  return iso;
}

function defaultProfile(){
  return { age:35, heightCm:162.56, weightLb:260, activityLevel:'light', proteinPerLb:0.7, deficit:150 };
}

let state = null;

async function loadState(){
  const local = localStorage.getItem(STORAGE_KEY);
  state = local ? JSON.parse(local) : null;
  let needsSave = false;
  if(!state){
    state = { profile: defaultProfile(), days: {}, favorites: seedFavorites(), mealPlanDays: seedMealPlanDays(), mealOverrides: {} };
    needsSave = true;
  }
  if(!state.favorites) { state.favorites = seedFavorites(); needsSave = true; }
  if(!state.profile) { state.profile = defaultProfile(); needsSave = true; }
  if(!state.mealPlanDays) { state.mealPlanDays = seedMealPlanDays(); needsSave = true; }
  if(!state.mealOverrides) { state.mealOverrides = {}; needsSave = true; }
  if(needsSave) saveState();
  renderAll();
  syncFromFirebase();
}

function saveState(){
  state.updatedAt = Date.now();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  pushToFirebase();
}

let firebaseReady = false;
let firebaseUser = null;

function initFirebase(){
  if(!window.firebase || !FIREBASE_CONFIG.apiKey){ console.warn('Firebase not configured — local-only mode.'); return; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    firebase.auth().signInAnonymously().then(function(cred){
      firebaseUser = cred.user;
      firebaseReady = true;
      syncFromFirebase();
    }).catch(function(e){ console.error('Firebase auth failed', e); });
  }catch(e){ console.error('Firebase init failed', e); }
}

function pushToFirebase(){
  if(!firebaseReady || !firebaseUser) return;
  firebase.firestore().collection('nutrition-ledger').doc(firebaseUser.uid)
    .set({ value: JSON.stringify(state), updatedAt: state.updatedAt })
    .catch(function(e){ console.error('Firebase sync failed (saved locally)', e); });
}

function syncFromFirebase(){
  if(!firebaseReady || !firebaseUser) return;
  firebase.firestore().collection('nutrition-ledger').doc(firebaseUser.uid).get()
    .then(function(doc){
      if(!doc.exists){ pushToFirebase(); return; }
      const remote = doc.data();
      const remoteUpdated = remote.updatedAt || 0;
      const localUpdated = state.updatedAt || 0;
      if(remoteUpdated > localUpdated){
        state = JSON.parse(remote.value);
        localStorage.setItem(STORAGE_KEY, remote.value);
        renderAll();
      } else if(localUpdated > remoteUpdated){
        pushToFirebase();
      }
    })
    .catch(function(e){ console.error('Firebase read failed (using local copy)', e); });
}

function computeTargets(profile){
  const kg = profile.weightLb * 0.453592;
  const cm = profile.heightCm;
  const age = profile.age || 35;
  const bmr = 10*kg + 6.25*cm - 5*age - 161;
  const multipliers = { sedentary:1.2, light:1.375, moderate:1.55, active:1.725 };
  const tdee = bmr * (multipliers[profile.activityLevel] || 1.375);
  const calories = Math.round(tdee - profile.deficit);
  const proteinG = Math.round(profile.proteinPerLb * profile.weightLb);
  const fatG = Math.round((calories * 0.28) / 9);
  const proteinCals = proteinG * 4;
  const fatCals = fatG * 9;
  const carbsG = Math.max(0, Math.round((calories - proteinCals - fatCals) / 4));
  return { calories: calories, proteinG: proteinG, carbsG: carbsG, fatG: fatG, sodiumMax: 2300, tdee: Math.round(tdee), bmr: Math.round(bmr) };
}

function parseDailyPaste(text){
  function extract(labelPattern){
    const re = new RegExp(labelPattern + '\\s*[:=]?\\s*~?\\$?([\\d,]+(?:\\.\\d+)?)', 'i');
    const m = text.match(re);
    return m ? parseFloat(m[1].replace(/,/g,'')) : null;
  }
  return {
    calories: extract('calor(?:ies)?'),
    proteinG: extract('protein'),
    carbsG: extract('carb(?:ohydrate)?s?'),
    fatG: extract('fat'),
    sodiumMg: extract('sodium'),
    fiberG: extract('fiber'),
    waterOz: extract('water')
  };
}

function buildLineChart(points, targetLine){
  if(points.length < 2) return '<p style="font-size:12.5px;color:var(--parchment-dim);">Log a few more days to see a trend.</p>';
  const w = 300, h = 120, pad = 16;
  const values = points.map(p => p.v);
  const min = Math.min(...values, targetLine || values[0]);
  const max = Math.max(...values, targetLine || values[0]);
  const range = (max - min) || 1;
  const stepX = (w - pad*2) / (points.length - 1);
  const coords = points.map((p,i) => {
    const x = pad + i*stepX;
    const y = h - pad - ((p.v - min) / range) * (h - pad*2);
    return [x,y];
  });
  const path = coords.map(c => c.join(',')).join(' ');
  const dots = coords.map(function(c){ return '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="2.5" fill="var(--brass-bright)"/>'; }).join('');
  let targetPath = '';
  if(targetLine){
    const ty = h - pad - ((targetLine - min) / range) * (h - pad*2);
    targetPath = '<line x1="' + pad + '" y1="' + ty + '" x2="' + (w-pad) + '" y2="' + ty + '" stroke="var(--sage)" stroke-width="1.5" stroke-dasharray="4,3"/>';
  }
  return '<svg width="100%" viewBox="0 0 ' + w + ' ' + h + '" style="overflow:visible;">' +
    '<polyline points="' + path + '" fill="none" stroke="var(--brass)" stroke-width="2"/>' +
    dots + targetPath +
    '<text x="' + pad + '" y="' + (h-2) + '" fill="var(--parchment-dim)" font-size="9">' + Math.round(min) + '</text>' +
    '<text x="' + (w-pad-20) + '" y="' + (h-2) + '" fill="var(--parchment-dim)" font-size="9">' + Math.round(max) + '</text>' +
    '</svg>';
}

function insertItemIntoWeek(itemId, servingsNeeded){
  let remaining = servingsNeeded;
  for(let i = 0; i < 7 && remaining > 0; i++){
    const iso = addDays(todayISO(), i);
    if(!state.mealOverrides[iso]) state.mealOverrides[iso] = {};
    if(state.mealOverrides[iso].Snack) continue;
    state.mealOverrides[iso].Snack = itemId;
    remaining--;
  }
}

    : '';

  sec.innerHTML = `
    <div class="card">
      <h2>Weekly guideline</h2>
      <p class="sub">Adjust any slot any time — this is a guideline, not a rulebook. Cravings and recent buys get worked in automatically without you needing to edit this.</p>
    </div>
    ${overrideNote}
    ${blocks}
  `;
}

function setMealSlot(dayIndex, slot, itemId){
  state.mealPlanDays[dayIndex].slots[slot] = itemId;
  saveState();
  showToast('Updated ' + state.mealPlanDays[dayIndex].day + ' ' + slot);
}

function renderShoppingList(){
  const sec = document.getElementById('shopping');
  if(!sec) return;
  const neededCounts = {};
  for(let i = 0; i < 7; i++){
    const iso = addDays(todayISO(), i);
    MEAL_SLOTS.forEach(function(slot){
      const itemId = effectiveMealSlotItem(iso, slot);
      if(itemId && itemId !== 'flex'){
        neededCounts[itemId] = (neededCounts[itemId] || 0) + 1;
      }
    });
  }
  const rows = Object.keys(neededCounts).map(function(id){
    const item = findFoodById(id);
    if(!item) return '';
    if(item.status === 'have') return '';
    const servings = item.servingsPerPackage || 1;
    const packagesNeeded = Math.max(1, Math.ceil(neededCounts[id] / servings));
    return { id: id, name: item.name, note: neededCounts[id] + 'x this week &middot; ' + packagesNeeded + ' package' + (packagesNeeded>1?'s':'') };
  }).filter(Boolean);

  const listHtml = rows.map(function(r){
    return '<div class="shop-item"><input type="checkbox" onchange="checkOffShoppingItem(\'' + r.id + '\', this.checked)"><div><div class="sn">' + r.name + '</div><div class="sm">' + r.note + '</div></div></div>';
  }).join('');

  sec.innerHTML = `
    <div class="card">
      <h2>This week\u2019s shopping list</h2>
      <p class="sub">Built from your meal plan for the next 7 days, minus anything you already marked "have it." Check something off once it's in your cart.</p>
      ${listHtml || '<div class="empty">Nothing to buy — you have everything this week\u2019s plan needs.</div>'}
    </div>
  `;
}

function checkOffShoppingItem(id, checked){
  if(checked){
    const item = findFoodById(id);
    if(item){ item.status = 'have'; saveState(); renderAll(); showToast(item.name + ' checked off'); }
  }
}

const ENERGY_TYPES = ['energized','motivated','steady','foggy','sluggish','irritable'];
let pickedEnergyRating = null;

function renderCycleTab(){
  const sec = document.getElementById('cycle');
  if(!sec) return;
  const todayIso = todayISO();
  const phaseInfo = cyclePhaseForDate(todayIso);
  const phaseBlock = phaseInfo
    ? '<span class="phase-badge">' + phaseInfo.phase + ' &middot; day ' + phaseInfo.day + '</span>'
    : '<p class="sub">Log a period start date below to begin tracking your phase.</p>';

  const todayEnergy = cycleState.energyLogs[todayIso];
  const activeRating = pickedEnergyRating !== null ? pickedEnergyRating : (todayEnergy ? todayEnergy.rating : null);
  const scaleButtons = [1,2,3,4,5].map(function(n){ return '<button class="' + (activeRating===n ? 'picked' : '') + '" onclick="pickEnergyRating(' + n + ')">' + n + '</button>'; }).join('');
  const typeOptions = ENERGY_TYPES.map(function(t){ return '<option value="' + t + '" ' + (todayEnergy && todayEnergy.type===t ? 'selected' : '') + '>' + t + '</option>'; }).join('');

  const recentStarts = cycleState.periodStarts.slice().sort().reverse().slice(0,6);
  const startsRows = recentStarts.map(function(iso){ return '<div class="plan-ex-row"><span>' + formatDateDisplay(iso) + '</span><button class="remove-x" onclick="removePeriodStartUI(\'' + iso + '\')">&times;</button></div>'; }).join('');

  const historyRows = [];
  for(let i=0;i<14;i++){
    const iso = addDays(todayIso, -i);
    const p = cyclePhaseForDate(iso);
    const e = cycleState.energyLogs[iso];
    const nutriDay = state.days[iso];
    if(!p && !e && !nutriDay) continue;
    historyRows.push('<div class="cycle-history-row"><span>' + formatDateDisplay(iso) + '</span><span>' + (p ? p.phase + ' d' + p.day : '\u2014') + '</span><span>' + (e ? e.rating + '/5 ' + e.type : '\u2014') + '</span><span>' + (nutriDay ? nutriDay.calories + 'cal/' + nutriDay.proteinG + 'gP' : '\u2014') + '</span></div>');
  }

  sec.innerHTML = `
    <div class="card">
      <h2>Where you're at</h2>
      ${phaseBlock}
    </div>
    <div class="card">
      <h2>Log today's energy</h2>
      <p class="sub">Rating (1 = wiped out, 5 = great) and what it feels like.</p>
      <div class="energy-scale">${scaleButtons}</div>
      <div class="row-flex">
        <select id="energy-type">${typeOptions}</select>
      </div>
      <div class="notes-field"><textarea id="energy-notes" placeholder="Notes (optional)">${todayEnergy ? todayEnergy.notes : ''}</textarea></div>
      <button class="log-btn" onclick="saveEnergyToday()">Save today's energy</button>
    </div>
    <div class="card">
      <h2>Period start dates</h2>
      <div class="row-flex">
        <input type="date" id="period-start-input" value="${todayIso}">
        <button onclick="addPeriodStartUI()">Log start</button>
      </div>
      ${startsRows || '<div class="empty">None logged yet.</div>'}
      <div class="row-flex" style="margin-top:10px;">
        <div class="field" style="flex:1;"><label>avg cycle length</label><input type="number" id="cycle-length-input" value="${cycleState.avgCycleLength}"></div>
        <div class="field" style="flex:1;"><label>avg period length</label><input type="number" id="period-length-input" value="${cycleState.avgPeriodLength}"></div>
        <button onclick="saveCycleLengths()" style="align-self:flex-end;">Save</button>
      </div>
    </div>
    <div class="card">
      <h2>Last 14 days &mdash; phase, energy & nutrition side by side</h2>
      ${historyRows.join('') || '<div class="empty">Nothing logged yet.</div>'}
    </div>
  `;
}

function pickEnergyRating(n){ pickedEnergyRating = n; renderCycleTab(); }

function saveEnergyToday(){
  const iso = todayISO();
  const existing = cycleState.energyLogs[iso];
  const rating = pickedEnergyRating || (existing ? existing.rating : 3);
  const type = document.getElementById('energy-type').value;
  const notes = document.getElementById('energy-notes').value.trim();
  logEnergy(iso, rating, type, notes);
  pickedEnergyRating = null;
  renderCycleTab();
  showToast('Energy logged');
}

function addPeriodStartUI(){
  const val = document.getElementById('period-start-input').value;
  if(!val) return;
  logPeriodStart(val);
  renderCycleTab();
  showToast('Period start logged');
}

function removePeriodStartUI(iso){
  removePeriodStart(iso);
  renderCycleTab();
}

function saveCycleLengths(){
  const len = parseInt(document.getElementById('cycle-length-input').value) || 28;
  const plen = parseInt(document.getElementById('period-length-input').value) || 5;
  cycleState.avgCycleLength = len;
  cycleState.avgPeriodLength = plen;
  saveCycleState();
  renderCycleTab();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1600);
}

document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    document.querySelectorAll('main section').forEach(function(s){ s.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

loadState();
initFirebase();
initCycleFirebase(renderCycleTab);
</script>
</body>
</html>
